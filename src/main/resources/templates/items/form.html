<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? 'Edit item' : 'New item'">Item</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: topbar}"></div>
<main class="container py-4">
    <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3" th:text="${editing} ? 'Edit item' : 'New item'">Item</h1>

        <form th:action="${editing} ? @{/items/{id}(id=${item.id})} : @{/items}"
              th:object="${item}" method="post" class="vstack gap-3">
            <div>
                <label class="form-label" for="name">Name</label>
                <input id="name" class="form-control" th:field="*{name}">
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div>
                <label class="form-label" for="sku">SKU</label>
                <input id="sku" class="form-control" th:field="*{sku}">
                <div class="text-danger small" th:errors="*{sku}"></div>
            </div>
            <div>
                <label class="form-label" for="category">Category</label>
                <input id="category" class="form-control" th:field="*{category}">
                <div class="text-danger small" th:errors="*{category}"></div>
            </div>
            <div>
                <label class="form-label" for="quantityOnHand">Quantity on hand</label>
                <input id="quantityOnHand" class="form-control" type="number" min="0"
                       th:field="*{quantityOnHand}">
                <div class="text-danger small" th:errors="*{quantityOnHand}"></div>
            </div>
            <div class="form-check">
                <input id="active" class="form-check-input" type="checkbox" th:field="*{active}">
                <label class="form-check-label" for="active">Active (can be checked out later)</label>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/items}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
