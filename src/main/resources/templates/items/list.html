<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Items · StockRoom</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: topbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Items</h1>
        <a th:href="@{/items/new}" class="btn btn-dark"
           sec:authorize="hasRole('ADMIN')">New item</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}">Saved</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <form class="row g-2 mb-3" method="get" th:action="@{/items}">
        <div class="col-md-6">
            <input class="form-control" type="search" name="q" th:value="${q}"
                   placeholder="Search name, SKU, or category">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-dark" type="submit">Search</button>
        </div>
    </form>

    <div th:if="${items.isEmpty()}" class="text-secondary">No items match.</div>

    <table th:if="${!items.isEmpty()}" class="table table-striped bg-white">
        <thead>
        <tr>
            <th>Name</th>
            <th>SKU</th>
            <th>Category</th>
            <th class="text-end">Qty</th>
            <th>Status</th>
            <th></th>
            <th sec:authorize="hasRole('ADMIN')"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}">Name</td>
            <td th:text="${item.sku}">SKU</td>
            <td th:text="${item.category}">Cat</td>
            <td class="text-end" th:text="${item.quantityOnHand}">0</td>
            <td>
                <span th:if="${item.active}" class="badge text-bg-success">Active</span>
                <span th:unless="${item.active}" class="badge text-bg-secondary">Inactive</span>
            </td>
            <td>
                <a th:if="${item.active and item.quantityOnHand > 0}"
                   th:href="@{/checkouts/new(itemId=${item.id})}">Check out</a>
            </td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/items/{id}/edit(id=${item.id})}">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
