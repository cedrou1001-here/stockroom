<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · StockRoom</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">StockRoom</span>
    </div>
</nav>
<main class="container py-5">
    <div class="col-md-5 col-lg-4">
        <h1 class="h3 mb-3">Log in</h1>

        <div th:if="${param.error}" class="alert alert-danger">
            Username or password is wrong. Try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You are logged out.
        </div>

        <!-- th:action adds a hidden CSRF token. Spring Security expects that. -->
        <form th:action="@{/login}" method="post" class="vstack gap-3">
            <div>
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" class="form-control" required autofocus>
            </div>
            <div>
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark">Log in</button>
        </form>

        <p class="small text-secondary mt-4 mb-0">
            Demo accounts: <code>admin</code> / <code>admin123</code>
            and <code>staff</code> / <code>staff123</code>
        </p>
    </div>
</main>
</body>
</html>
