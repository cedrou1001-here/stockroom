<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New checkout · StockRoom</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: topbar}"></div>
<main class="container py-4">
    <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Check out an item</h1>

        <form th:action="@{/checkouts}" th:object="${checkoutForm}" method="post" class="vstack gap-3">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                 th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>

            <div>
                <label class="form-label" for="itemId">Item</label>
                <select id="itemId" class="form-select" th:field="*{itemId}">
                    <option value="">Choose an item</option>
                    <option th:each="item : ${itemChoices}" th:value="${item.id}"
                            th:disabled="${!item.active or item.quantityOnHand < 1}"
                            th:text="${item.name} + ' — ' + ${item.quantityOnHand} + ' on shelf'">
                    </option>
                </select>
                <div class="text-danger small" th:errors="*{itemId}"></div>
            </div>
            <div>
                <label class="form-label" for="borrowerName">Borrower name</label>
                <input id="borrowerName" class="form-control" th:field="*{borrowerName}">
                <div class="text-danger small" th:errors="*{borrowerName}"></div>
            </div>
            <div>
                <label class="form-label" for="borrowerEmail">Borrower email</label>
                <input id="borrowerEmail" class="form-control" type="email" th:field="*{borrowerEmail}">
                <div class="text-danger small" th:errors="*{borrowerEmail}"></div>
            </div>
            <div>
                <label class="form-label" for="quantity">Quantity</label>
                <input id="quantity" class="form-control" type="number" min="1" th:field="*{quantity}">
                <div class="text-danger small" th:errors="*{quantity}"></div>
            </div>
            <div>
                <label class="form-label" for="dueDate">Due date</label>
                <input id="dueDate" class="form-control" type="date" th:field="*{dueDate}">
                <div class="text-danger small" th:errors="*{dueDate}"></div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit">Check out</button>
                <a class="btn btn-outline-secondary" th:href="@{/checkouts}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
