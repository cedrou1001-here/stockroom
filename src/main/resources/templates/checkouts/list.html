<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkouts · StockRoom</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: topbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Open checkouts</h1>
        <a class="btn btn-dark" th:href="@{/checkouts/new}">New checkout</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}">Saved</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <div th:if="${checkouts.isEmpty()}" class="text-secondary">Nothing is out right now.</div>

    <table th:if="${!checkouts.isEmpty()}" class="table table-striped bg-white">
        <thead>
        <tr>
            <th>Item</th>
            <th>Borrower</th>
            <th class="text-end">Qty</th>
            <th>Due</th>
            <th>By</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${checkouts}">
            <td>
                <span th:text="${loan.item.name}">Item</span>
                <span class="text-secondary" th:text="'(' + ${loan.item.sku} + ')'"></span>
            </td>
            <td>
                <div th:text="${loan.borrowerName}">Name</div>
                <div class="small text-secondary" th:text="${loan.borrowerEmail}">email</div>
            </td>
            <td class="text-end" th:text="${loan.quantity}">1</td>
            <td>
                <span th:text="${loan.dueDate}">2026-01-01</span>
                <span th:if="${loan.overdue}" class="badge text-bg-danger">Overdue</span>
            </td>
            <td th:text="${loan.checkedOutBy}">staff</td>
            <td>
                <form th:action="@{/checkouts/{id}/return(id=${loan.id})}" method="post">
                    <button class="btn btn-sm btn-outline-dark" type="submit">Return</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
