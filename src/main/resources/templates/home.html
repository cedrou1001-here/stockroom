<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockRoom</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: topbar}"></div>
<main class="container py-5">
    <h1 class="display-6 mb-1">You're in.</h1>
    <p class="lead text-secondary">
        Hello,
        <strong sec:authentication="name">user</strong>.
    </p>

    <div class="row g-3 my-3">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="text-secondary small">Open checkouts</div>
                    <div class="fs-3" th:text="${stats.openCheckouts}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="text-secondary small">Overdue</div>
                    <div class="fs-3" th:text="${stats.overdue}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="text-secondary small">Items in catalog</div>
                    <div class="fs-3" th:text="${stats.itemCount}">0</div>
                </div>
            </div>
        </div>
    </div>

    <p>
        <a th:href="@{/checkouts}">Checkouts</a>
        are who has what.
        <a th:href="@{/items}">Items</a>
        is the shelf.
    </p>
</main>
</body>
</html>
