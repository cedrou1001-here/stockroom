# Display name in logs
spring.application.name=StockRoom

# H2 is a small database stored in a local file (no Docker needed yet).
# The folder ./data will be created when the app first starts.
spring.datasource.url=jdbc:h2:file:./data/stockroom
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# We will let Flyway create tables later. Hibernate should not invent its own.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway runs SQL files in src/main/resources/db/migration on startup.
spring.flyway.enabled=true

# Browser tool to peek at tables later: http://localhost:8080/h2-console
# JDBC URL must match spring.datasource.url above.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
